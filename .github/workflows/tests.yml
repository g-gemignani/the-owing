name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # One place to bump. The project targets 4.7; a mismatch shows up as parse
  # errors rather than test failures, so it is pinned.
  GODOT_VERSION: "4.7-stable"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ~100 MB download otherwise, on every single run.
      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          file="Godot_v${GODOT_VERSION}_linux.x86_64"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${file}.zip"
          unzip -q godot.zip
          mkdir -p ~/godot-bin
          mv "${file}" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Put Godot on PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      # Reimporting every texture and audio file takes longer than the tests do.
      # Keyed on the assets and resources themselves, so changing one correctly
      # misses the cache and a stale import can never mask a broken resource.
      - name: Cache import artifacts
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('assets/**', 'resources/**', 'project.godot') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Import resources
        # The first import is expected to be noisy and is allowed to fail; the
        # test suite below is the real check.
        run: godot --headless --import || true

      - name: Run test suite
        run: tests/run.sh
