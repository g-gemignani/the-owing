  # --- publish ------------------------------------------------------------------
  #
  # Two channels through one job (D251), because they differ in four values and in nothing
  # else — the artifacts, the staging, the stock-taking and the notes are identical, and a
  # second job would be that whole body copied to vary a tag name.
  #
  #   a `v*` tag       -> a release that is KEPT. `--latest`, no prerelease flag, and the
  #                       tag is the pipeline's INPUT, so it is never cleaned up.
  #   a push to main   -> ONE prerelease under `main-latest`, deleted and recreated every
  #                       push. Here the tag is an OUTPUT of the pipeline, so it IS cleaned
  #                       up: the release must point at the new commit, and a tag left
  #                       behind would make the next `create` land on the old one.
  #
  # D227 removed a rolling channel and this brings one back, deliberately narrower. What
  # broke then was that the rolling build was the DEFAULT download: it was the newest thing
  # on the releases page mid-way through a design inversion (D226), with no way to say "not
  # that one". Two things now say it. `--latest=false` keeps
  # `/releases/latest/download/<file>` — the URLs the README serves — resolved to the newest
  # `v*` release and never to this, and the downloads page prints the rolling build under a
  # heading that says it is replaced on every push. The channel is reachable for anyone who
  # wants today's build; it is not what an arriving player is handed.
  #
  # `main-latest` and not `main`: a tag with the same name as a branch makes every
  # `git checkout main` in the repository ambiguous, and git resolves it silently.
  release:
    needs: [build-desktop, build-android]
    if: >-
      github.event_name == 'push'
      && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
      && github.repository_owner == 'g-gemignani'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Per ref, so two tags pushed together publish in parallel instead of queueing behind
    # one group. Queued rather than cancelled within a ref: a re-run of the same tag racing
    # itself would otherwise leave half a release standing. On main that queueing is
    # load-bearing rather than incidental — two pushes a minute apart both delete and
    # recreate one tag, and cancelling the first mid-delete is how `main-latest` ends up
    # with no release under it at all.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # Which channel this run is, decided ONCE and read from outputs everywhere below.
      # Every later step then contains no `if`, no second `startsWith`, and no second
      # opinion about what `main-latest` is called — the D34 shape in a workflow file is a
      # ref test repeated in five steps, four of which get updated when the rule moves.
      - name: Decide which channel this is
        id: chan
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            {
              echo "kind=tag"
              echo "tag=$GITHUB_REF_NAME"
              echo "title=The Owing $GITHUB_REF_NAME"
              # A version is what the README's links resolve to, and `--latest` is explicit
              # rather than left to GitHub's own ordering, which picks by tag date and would
              # hand the pointer to a hotfix cut from an older branch.
              echo "flags=--latest"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "kind=main"
              echo "tag=main-latest"
              echo "title=The Owing — build of main"
              # `--latest=false` is the flag holding the README's download URLs up. Without
              # it this prerelease becomes what `/releases/latest/download/<file>` serves,
              # which is D227's failure exactly.
              echo "flags=--prerelease --latest=false"
            } >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: staged
          pattern: dist-*
          merge-multiple: true

      # `build-ios` is allowed to fail, so its artifact may simply not be here. That is
      # a thing to SAY, not a thing to paper over: the notes list what was actually
      # built, so a release missing a platform cannot read like a complete one.
      - name: Take stock of what arrived
        id: stock
        run: |
          set -euo pipefail
          ls -lh staged
          have() { [ -s "staged/$1" ] && echo yes || echo no; }
          {
            echo "linux=$(have TheOwing-linux-x86_64.zip)"
            echo "windows=$(have TheOwing-windows-x86_64.zip)"
            echo "macos=$(have TheOwing-macos-universal.zip)"
            echo "android=$(have TheOwing-android.apk)"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          SIGNING: ${{ needs.build-android.outputs.signing }}
          KIND: ${{ steps.chan.outputs.kind }}
        run: |
          set -euo pipefail
          # What this build IS, first, because it is the one thing that differs between the
          # two channels and the one thing somebody deciding whether to download needs.
          if [ "$KIND" = main ]; then
            cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          **This is the rolling build of `main`, not a version.** It is replaced by the next
          push, it is whatever is being worked on today, and half-finished work is expected
          in it. For the build that was decided to be worth publishing, take the
          [latest release](https://github.com/g-gemignani/the-owing/releases/latest); every
          version ever cut is on the
          [downloads page](https://g-gemignani.github.io/the-owing/).
          NOTES
          else
            cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          A build of the commit this tag names. It is a **prototype**: the version number
          orders the releases and promises nothing beyond that.
          NOTES
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'

          Saves carry their own version and are migrated forward, so an existing character
          survives the upgrade.

          | platform | file | first run |
          |---|---|---|
          | Linux | `TheOwing-linux-x86_64.zip` | `chmod +x TheOwing.x86_64 && ./TheOwing.x86_64` |
          | Windows | `TheOwing-windows-x86_64.zip` | unsigned — SmartScreen warns once: *More info* → *Run anyway* |
          | macOS | `TheOwing-macos-universal.zip` | unsigned — `xattr -dr com.apple.quarantine "The Owing.app"` before opening |
          | Android | `TheOwing-android.apk` | `adb install`, or copy it over and allow unknown sources |

          The APK needs **Android 7.0 or newer** — that is Godot 4.7's own floor, not a
          choice — and carries both 32-bit (`armeabi-v7a`) and 64-bit (`arm64-v8a`) ARM,
          so any phone from 7.0 up can install it. It asks for OpenGL ES 3.0 and treats
          Vulkan as optional, falling back on devices that have none.

          There is **no iOS build**. It is written and commented out in
          `.github/workflows/ci.yml`, because it never got past `xcodebuild`; the
          reasoning is in D147.

          Nothing here is code-signed, and nothing here will be: that needs a paid
          developer identity per platform. Two consequences worth knowing before you
          download rather than after:

          * **Neither mobile build has been run on real hardware.** Text size at phone
            DPI is the most likely thing to be wrong.

          **Which build is this?** Every build stamps its own commit: the title screen shows
          it in the bottom corner and Settings spells it out, as
          `v<version>+<date>.<commit>`. Quote that in a bug report — the asset filenames are
          the same in every release, so a downloaded copy cannot otherwise say which one it
          came from.

          On **NixOS** the Linux binary needs `steam-run`, or a `patchelf
          --set-interpreter` — see
          [BUILD.md](https://github.com/g-gemignani/the-owing/blob/main/BUILD.md).
          NOTES
          # What signing means for THIS build, which is a fact about the run rather than
          # about the project — a note that says "uninstall first" when it is no longer
          # true is how a fixed problem keeps being reported (D157).
          if [ "${SIGNING:-throwaway}" = stable ]; then
            cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'
          * **The APK is signed with the project's own key, so it installs over an earlier
            build.** It is still self-signed: installable, not trusted, and not a Play Store
            build. The first build after the key was introduced needed one uninstall; this is
            not that build.
          NOTES
          else
            cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'
          * **The APK is signed with a throwaway key, regenerated every build**, so Android
            treats it as a different app from the copy already on the phone and refuses the
            install. *"App not installed"* is what that refusal looks like — it says nothing
            about signatures. **Uninstall the old build first.** Set
            `ANDROID_KEYSTORE_BASE64` (see `tools/make_release_key.sh`) and this stops
            happening.
          NOTES
          fi
          # Unquoted heredoc: the block above must expand nothing (it is all backticks
          # and markdown), and this must expand exactly one variable.
          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          Built from \`$GITHUB_SHA\`.
          NOTES

      # Deleted and recreated rather than edited in place. Force-moving a git tag under
      # an existing release leaves the release still recording the OLD commit, and
      # `gh release edit` has no way to correct it — so the page would claim a build
      # came from a commit it did not. The assets go up in the create call itself, so a
      # failed upload cannot leave an empty release standing where a good one was.
      #
      # **`--cleanup-tag` on one channel and not the other, and that is the important word
      # here.** A `v*` tag is the pipeline's INPUT — the thing the developer pushed to ask
      # for this build — and cleaning it up would delete from the repository the version it
      # was asked to publish, so a re-run of the same tag would erase it. `main-latest` is
      # the pipeline's OUTPUT: nobody pushed it, it has to move to the new commit every
      # time, and a tag left standing after the release under it is deleted is a tag the
      # next `create` silently reuses — publishing today's assets against last week's
      # commit, which is the provenance bug D227's tag check exists to prevent.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` resolves the repository from the git remote, and this job has no
          # checkout — it only downloads artifacts. `GITHUB_REPOSITORY` is not what it
          # reads; `GH_REPO` is. Without it every `gh release` call fails to resolve a
          # repository, `view` reports no release, the delete is skipped, and `create`
          # ends on "a release with that tag already exists" (D146).
          GH_REPO: ${{ github.repository }}
          KIND: ${{ steps.chan.outputs.kind }}
          TAG: ${{ steps.chan.outputs.tag }}
          TITLE: ${{ steps.chan.outputs.title }}
          FLAGS: ${{ steps.chan.outputs.flags }}
        run: |
          set -euo pipefail
          # An `if` and not `[ "$KIND" = main ] && cleanup=...`. Under `set -e` the second
          # form is an AND-list whose status is the failing test's, and whether that exits
          # is a corner of the spec bash and dash read differently. A publish step is the
          # wrong place to be relying on which shell the runner image points `bash` at.
          cleanup=""
          if [ "$KIND" = main ]; then
            cleanup="--cleanup-tag"
          fi
          # Checked, then deleted WITHOUT `|| true`. The first version swallowed the
          # delete's exit code, so when a repository rename made the API 301 the delete
          # away, the failure surfaced three lines later as "a release with that tag
          # already exists" — a true message about the wrong cause (D146).
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes $cleanup
          fi
          # $FLAGS is deliberately UNQUOTED: it carries one or two whole flags decided by
          # the channel step, and quoting it would pass `--prerelease --latest=false` as a
          # single argument that gh rejects. It is set by this workflow and never by input.
          gh release create "$TAG" staged/* \
            --target "$GITHUB_SHA" \
            $FLAGS \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "### Published — $KIND channel"
            echo "<https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}>"
            echo
            find staged -maxdepth 1 -type f -printf '- %f\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"

  # --- the downloads page -------------------------------------------------------
  #
  # Every version that can still be downloaded, on one page (D251). It is generated from
  # the releases API and never committed: a copy in the tree would be a second statement of
  # a fact the API owns, and it would be wrong from the next release onward.
  #
  # Deployed after `release` rather than beside it, because it renders what that job just
  # published — run in parallel and the page shows the state from before this build. It is
  # also reachable from `workflow_dispatch`, which is the way to rebuild it after a release
  # is edited or deleted by hand, and the only path here that does not need `release` to
  # have run.
  #
  # This needs Pages switched on for the repository with its source set to **GitHub
  # Actions** (Settings -> Pages). That is a one-time repository setting and cannot be made
  # from a workflow file; until it is set, this job fails on `configure-pages` and nothing
  # else in the pipeline is affected.
  # NOT on a tag (D313). `environment: github-pages` is gated by that environment's own branch
  # policy, and the policy names branches — so a run whose ref is `refs/tags/v0.2.0` is rejected
  # by GitHub before the first step executes: *"Tag v0.2.0 is not allowed to deploy to
  # github-pages due to environment protection rules"*. The job goes red with ZERO steps, which is
  # the tell, and it took the whole v0.2.0 release run red with it after the release itself had
  # published all four assets successfully.
  #
  # The page loses nothing by skipping the tag. `tools/downloads_page.py` asks the API for the
  # release list when it runs, so ANY later render lists every version — and cutting a version is
  # already followed by `tools/readme_downloads.sh` and a commit (BUILD.md), which is a push to
  # main and therefore the render. The alternative is a settings change nobody can see from the
  # repository, which is the worse half of the same fix: this file would still say the job runs on
  # tags, and it would be true only for as long as somebody remembers the policy.
  pages:
    needs: [release]
    if: >-
      always()
      && github.repository_owner == 'g-gemignani'
      && !startsWith(github.ref, 'refs/tags/')
      && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One page, one deployment. Cancelled rather than queued, which is the opposite of the
    # release job's choice and correct for the opposite reason: a superseded render of a
    # page has nothing in it worth waiting for, and two pushes a minute apart should leave
    # the newer one standing rather than the older one finishing last.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # The token is for the rate limit only — the endpoint is public and this works
      # unauthenticated, which is what lets the same script run on a laptop.
      - name: Build the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/downloads_page.py site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
