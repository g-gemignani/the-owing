name: ci

# Was `tests.yml`, and was only tests until the `release` job below joined it. One
# workflow rather than two chained by `workflow_run`: a release must never publish a
# build the suite has not passed, and `needs:` says that in one line where
# `workflow_run` says it in a second file, with its own checkout of a SHA that has to
# be threaded through by hand. The JOB names are unchanged, so any required status
# check still resolves.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # One place to bump. The project targets 4.7; a mismatch shows up as parse
  # errors rather than test failures, so it is pinned.
  GODOT_VERSION: "4.7.1-stable"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keyed on the assets and resources themselves, so changing one correctly
      # misses the cache and a stale import can never mask a broken resource.
      - name: Cache import artifacts
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('assets/**', 'resources/**', 'project.godot') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Run test suite
        run: tests/run.sh

  # Android and iOS can never be BUILT here — one needs a JDK and the Android SDK,
  # the other macOS with Xcode and a developer team ID. This job proves the only
  # thing standing between the project and those builds is the toolchain, so the
  # day someone installs it, the export works with no further edits.
  export-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      # every platform must be either buildable or blocked ONLY by a missing
      # toolchain — never by the project
      - name: Export readiness
        run: tests/export_ready.sh

      # and the built pack must actually contain its art, which only an export
      # can prove
      - name: Export smoke test
        run: tests/export.sh

  # --- builders -----------------------------------------------------------------
  #
  # One job per platform family rather than one job that exports everything, because
  # they no longer share a machine: iOS can only be built on macOS. They run only on
  # main, for the same reason the release does — a PR gets the suite and the
  # export-readiness check, which is what catches a project-side regression, and the
  # binaries are only wanted for something that is going to be published.

  build-desktop:
    needs: [test, export-ready]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository_owner == 'g-gemignani'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      # Stamp the commit into the build before exporting. The release channel is a rolling
      # tag, so every published APK has the same filename and a downloaded copy cannot
      # otherwise say which one it is (D156). Never committed stamped — `test_content.gd`
      # fails if it is.
      - name: Stamp the build
        run: tools/stamp_build.sh "$(git rev-parse --short=7 HEAD)" "${{ github.run_number }}"

      # `--export-release` is not reliably a truthful exit code — it returns non-zero
      # on import warnings that did not stop it, which is why `tests/export_ready.sh`
      # already treats the OUTPUT FILE as the verdict. So does this, with a size floor:
      # a zero-byte file at the right path is exactly the failure that would otherwise
      # be published as a release.
      - name: Export Linux, Windows and macOS
        run: |
          set -uo pipefail
          mkdir -p build/linux build/windows build/macos
          fail=0
          export_one() {
            local preset="$1" out="$2"
            godot --headless --export-release "$preset" "$PWD/$out" || true
            if [ ! -s "$out" ] || [ "$(stat -c%s "$out")" -lt 20000000 ]; then
              echo "::error::$preset produced no usable binary at $out"
              fail=1
              return
            fi
            printf '  %-8s %s\n' "$preset" "$(du -h "$out" | cut -f1)"
          }
          export_one Linux   build/linux/TheOwing.x86_64
          export_one Windows build/windows/TheOwing.exe
          export_one macOS   build/macos/TheOwing.zip
          exit $fail

      # Named for the game and the platform, because an asset name is the filename in
      # somebody's downloads folder. The macOS export is ALREADY a zip holding
      # `The Owing.app` and is only renamed: repacking it is how an .app loses the
      # permissions and symlinks that make it launchable.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -qj9 dist/TheOwing-linux-x86_64.zip   build/linux/TheOwing.x86_64 LICENSE
          zip -qj9 dist/TheOwing-windows-x86_64.zip build/windows/TheOwing.exe  LICENSE
          cp build/macos/TheOwing.zip dist/TheOwing-macos-universal.zip
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop
          path: dist/
          retention-days: 1

  # Godot finds the SDK and the JDK through ANDROID_HOME and JAVA_HOME, which the
  # runner image already sets — verified by exporting against a stubbed SDK: without
  # them Godot reports four separate "configure it in Editor Settings" errors, with
  # them all four disappear. So no editor-settings file has to be forged here.
  #
  # The preset sets `use_gradle_build=false`, so this uses the prebuilt APK template
  # from the .tpz and needs no `--install-android-build-template` and no Gradle. What
  # it does still need from the SDK is `apksigner` and `zipalign`.
  build-android:
    needs: [test, export-ready]
    outputs:
      signing: ${{ steps.key.outputs.signing }}
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository_owner == 'g-gemignani'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"

      # Android identifies an app by its SIGNATURE, not by its version: a package signed
      # with a different key than the installed copy is a different app claiming the same
      # name, and the installer refuses it with "App not installed" — no mention of keys,
      # which is why this cost a report to find (D157).
      #
      # So the key is stable IF the repository has one, and thrown away if it does not:
      #
      #   ANDROID_KEYSTORE_BASE64   the keystore, base64 (`tools/make_release_key.sh` prints it)
      #   ANDROID_KEYSTORE_ALIAS    optional, defaults to `theowing`
      #   ANDROID_KEYSTORE_PASSWORD optional, defaults to `theowing`
      #
      # REPOSITORY secrets, and not environment secrets: this job declares no `environment:`,
      # so an environment secret would simply not be here and the build would fall back to a
      # throwaway key with nothing to say about it. Environments buy approval gates and
      # per-target keys, neither of which one rolling channel with one key has any use for
      # (D161).
      #
      # With the secret set, every build installs over the last one. Without it the old
      # behaviour stands — a fresh self-signed key per build, installable but never
      # updatable — because a fork with no secrets must still produce an APK, and a job
      # that fails for a missing secret trains people to ignore a red build.
      #
      # Neither key makes the APK TRUSTED. A Play Store upload needs a real identity held
      # outside this repository; this only decides whether a phone treats two builds as
      # the same app.
      - name: Prepare the signing key
        id: key
        env:
          # SECRETS, not variables (D161). GitHub's `vars` are plaintext: readable in the
          # settings UI and unmasked in logs, which is the wrong place for a private key and
          # its password. The alias is the one value here that is not sensitive, so it is
          # accepted from either — a repository variable is a reasonable place for a name, and
          # somebody who puts it in the wrong tab should not get a silent fallback.
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS || vars.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks" || {
              echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Set it as a SECRET with the one-line blob tools/make_release_key.sh prints (Settings -> Secrets and variables -> Actions -> Secrets)."
              exit 1
            }
            alias="${KEYSTORE_ALIAS:-theowing}"
            pass="${KEYSTORE_PASSWORD:-theowing}"
            # A keystore that cannot be opened must fail HERE, loudly, rather than as a
            # Godot export that silently falls back to an unsigned package. The hint names
            # the two ways it goes wrong in practice: the password in the Variables tab
            # (where the workflow cannot see it, so this falls back to the default and the
            # store refuses to open) and an alias that is not the one in the keystore.
            keytool -list -keystore "$ks" -storepass "$pass" -alias "$alias" >/dev/null || {
              echo "::error::Cannot open the keystore with alias '$alias'. Check ANDROID_KEYSTORE_PASSWORD is set as a SECRET (not a variable — the workflow cannot read those) and that ANDROID_KEYSTORE_ALIAS matches the key. tools/make_release_key.sh prints both."
              exit 1
            }
            echo "signing=stable" >> "$GITHUB_OUTPUT"
            echo "This build is signed with the repository's own key: it installs over the previous one."
          else
            keytool -keyalg RSA -genkeypair -alias theowing -keypass theowing \
              -keystore "$ks" -storepass theowing \
              -dname "CN=The Owing CI, O=The Owing, C=IT" \
              -validity 9999 -deststoretype pkcs12
            alias=theowing
            pass=theowing
            echo "signing=throwaway" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key, so this APK cannot be installed over an earlier build. Make one with tools/make_release_key.sh, and set it as a REPOSITORY secret — an Environment secret is invisible here because this job declares no environment, and the Variables tab is not read for these (D161)."
          fi
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$pass"
          echo "pass=$pass" >> "$GITHUB_OUTPUT"

      # Stamp the commit into the build before exporting. The release channel is a rolling
      # tag, so every published APK has the same filename and a downloaded copy cannot
      # otherwise say which one it is (D156). Never committed stamped — `test_content.gd`
      # fails if it is.
      - name: Stamp the build
        run: tools/stamp_build.sh "$(git rev-parse --short=7 HEAD)" "${{ github.run_number }}"

      - name: Export the APK
        env:
          # Godot reads these instead of the editor settings — the one part of Android
          # export that was designed for CI.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ steps.key.outputs.alias }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ steps.key.outputs.pass }}
        run: |
          set -uo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}  JAVA_HOME=${JAVA_HOME:-unset}"
          mkdir -p dist
          godot --headless --export-release "Android" "$PWD/dist/TheOwing-android.apk" || true
          if [ ! -s dist/TheOwing-android.apk ]; then
            echo "::error::the Android export produced no APK"
            exit 1
          fi
          du -h dist/TheOwing-android.apk

      # apksigner writes a `.idsig` sidecar next to the APK — the v4 signature, which
      # `adb install` can use and a human downloading a file cannot. It shipped as a
      # release asset once; nothing reads it off a release page, so it goes.
      - name: Drop the v4 signature sidecar
        run: rm -f dist/*.idsig

      # An APK that exports and is not a valid signed package is the failure this
      # catches: `apksigner verify` reads the archive the way a phone does.
      - name: Verify the signature
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$signer" verify --verbose dist/TheOwing-android.apk
          # The certificate digest is the thing a phone compares. Printed so that "why
          # will it not update" can be answered from two build logs (D157).
          "$signer" verify --print-certs dist/TheOwing-android.apk | grep -i "SHA-256 digest" || true

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/
          retention-days: 1

  # --- iOS: COMMENTED OUT, not deleted --------------------------------------------
  #
  # It never went green. Three CI rounds got the Xcode project out of Godot and then
  # stalled at `xcodebuild`, and the job log needs repository-admin rights to read, so
  # the next step was blind iteration at ten minutes a round against a toolchain that
  # cannot be reproduced on this machine. Commented out rather than deleted or left
  # red: a permanently failing job trains everyone to ignore the one place a failure is
  # supposed to be visible, and deleting it would throw away the part that DID work
  # (D147).
  #
  # What is known to work, and is preserved verbatim below: the macOS half of
  # `setup-godot`, the preset patch that gets Godot to emit an Xcode project at all
  # (placeholder team ID + `export_project_only`, located by `name="iOS"`), and the
  # Payload/-wrapping recipe. What is NOT known is why `xcodebuild` refuses. Restart
  # from the `xcodebuild -list` dump the job prints before it fails.
  #
  # `tests/export_ready.sh` still proves on EVERY run that the iOS preset is blocked
  # only by a missing toolchain and never by the project, so nothing here can rot
  # silently while it is switched off.
  #
  #   # iOS is the one target that cannot be cross-compiled: Apple's toolchain runs on
  #   # macOS and nowhere else. It is also the one target whose output cannot be installed
  #   # by double-clicking it — the .ipa below is UNSIGNED, because signing needs a paid
  #   # Apple developer identity that no repository can carry, so it is for re-signing
  #   # with AltStore/Sideloadly or an Xcode account, not for handing to a stranger.
  #   #
  #   # `continue-on-error` is deliberate and is the only job that gets it. This build
  #   # depends on whatever Xcode the macOS image happens to ship this month, and a
  #   # gameplay fix must not sit unreleased because Apple moved something. A failure here
  #   # is loud on the job, the release still goes out, and the notes say which platforms
  #   # are actually in it rather than quietly listing three.
  #   build-ios:
  #     needs: [test, export-ready]
  #     if: >-
  #       github.event_name == 'push'
  #       && github.ref == 'refs/heads/main'
  #       && github.repository_owner == 'g-gemignani'
  #     runs-on: macos-latest
  #     continue-on-error: true
  #     steps:
