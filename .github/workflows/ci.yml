  #     if: >-
  #       github.event_name == 'push'
  #       && startsWith(github.ref, 'refs/tags/v')
  #       && github.repository_owner == 'g-gemignani'
  #     runs-on: macos-latest
  #     continue-on-error: true
  #     steps:
