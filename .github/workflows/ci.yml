  #
  #       # Patched HERE and not committed. Godot refuses an iOS export with no team ID
  #       # even when it is only being asked for an Xcode project, and `export_project_only`
  #       # is wrong for anyone doing a real signed build on their own Mac — so the
  #       # committed preset stays honest and CI overrides it for the length of one job.
  #       # Located by NAME, not by `preset.4`: an index is a fact about the current file.
