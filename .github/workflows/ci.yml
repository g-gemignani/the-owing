  #           xcodebuild -list -project "$proj" || true
  #           # A TARGET, not a scheme. Godot's generated project has no *shared* scheme, so
  #           # `-scheme <name>` is a coin flip on whether xcodebuild can see one; every
  #           # project has targets. The name is read out of the project rather than guessed
  #           # from the filename, which is what the first attempt did.
