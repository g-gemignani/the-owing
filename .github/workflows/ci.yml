  #           echo "--- what the export actually produced ---"
  #           find build/ios -maxdepth 3 | head -40
  #
  #       # Discovered rather than assumed, and the listing above is printed either way:
  #       # the exact layout Godot writes for a project-only iOS export is the one thing
  #       # here that cannot be checked from Linux, so a first failure has to be readable.
